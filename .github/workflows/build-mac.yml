# Builds the Mac app on GitHub's Apple Silicon runner. Every push to main
# publishes it as a new release; the newest one is always at
# releases/latest/download/HandControl-mac.zip
name: Build Mac app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: ./build_mac.sh --no-install
      - uses: actions/upload-artifact@v4
        with:
          name: HandControl-mac
          path: dist/HandControl-mac.zip
      - if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Hand Control for Mac v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Download **HandControl-mac.zip** below, unzip it and drag HandControl into Applications.
            First launch: System Settings → Privacy & Security → **Open Anyway**. See the README for permissions.
          files: dist/HandControl-mac.zip
