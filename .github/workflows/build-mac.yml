# Builds the Mac app on GitHub's Apple Silicon runner. Download it from the
# run's "Artifacts" section, or push a tag like v1.0.0 to attach it to a release.
name: Build Mac app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: ./build_mac.sh --no-install
      - uses: actions/upload-artifact@v4
        with:
          name: HandControl-mac
          path: dist/HandControl-mac.zip
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HandControl-mac.zip
